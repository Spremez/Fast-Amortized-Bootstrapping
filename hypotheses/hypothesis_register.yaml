project: pvw_sab_686_optimization
date: 2026-06-23
scope: binary SET_2_3_2048, WSL/Linux performance platform
hypotheses:
  - id: H1_r_specialized_avx512
    statement: >
      Replacing the generic MAT_TRGSW row/output loop with r=2/r=4
      AVX512-specialized fused row/output accumulation should reduce DFT
      addmul overhead in the MAT external product and improve full SAB
      throughput over the current sab_pvw_* path.
    mechanism: >
      Load each decomposed DFT row once per vector block and update all
      k+r outputs, reducing repeated dec-row loads and generic function
      dispatch in polynomial_mul_addto_DFT.
    status: partially_supported_same_backend_full_sab_not_topline
    evidence: docs/stage16_full_sab_audit_log.md
    failure_criteria:
      - target correctness failure
      - staged kernel crash
      - full SAB speedup not better than existing clear-elision evidence
    current_decision: >
      Stage 15 and Stage 16 show that the refined FMA-accumulate AVX512 MAT
      path is correct and faster than repeated scalar SAB under the same
      spqlios_avx512 backend for r=2/r=4. It does not beat the accepted
      Stage 10/Stage 8 clear-elision top-line evidence and remains explicit
      flag only.
  - id: H2_full_pvw_postprocessing
    statement: >
      Extending PVW batching beyond blind rotation into extract, packing KS,
      and HW-reducing KS should raise full bootstrapping speedup beyond the
      current 1.269x-1.337x range.
    mechanism: >
      The current path materializes each PVW body and runs scalar packing/HW
      key switching per lane, leaving an O(r) post-processing tail.
    status: theory_pending_implementation
    evidence: docs/stage10_engineering_report.md
    failure_criteria:
      - PVW post-processing noise exceeds scalar baseline
      - key size or memory overhead becomes unacceptable
      - full SAB benchmark does not improve over current clear-elision path
  - id: H3_sab_specific_sparse_mat
    statement: >
      Exploiting the monomial/binary selector structure of 2025/686 SAB can
      reduce the dense (k+r)^2 MAT accumulation cost and enable larger-r
      scaling.
    mechanism: >
      MAT_TRGSW selectors in SAB are encrypted monomial selector bits; if their
      structure can be preserved or partially exposed in the evaluation form,
      some dense row-output products may be skipped or fused with automorphism
      and monomial rotation.
    status: theory_unverified
    evidence: docs/stage11_pvw_sab_loop_engineering.md
    failure_criteria:
      - selector structure is not exploitable after encryption/DFT conversion
      - any sparse shortcut changes CMUX semantics or noise distribution
      - correctness gate fails for target parameters
  - id: H4_cmux_sparse_schedule_fusion
    statement: >
      Reducing the CMUX wrapper, RGSW monomial, and sparse schedule overhead
      around MAT external products should improve complete SAB throughput more
      than additional dense MAT AVX512 tuning alone.
    mechanism: >
      Stage 14 measured CMUX as about 95%-96% of PVW body time while MAT EP
      accounted for about 44%-47%, leaving roughly half of the CMUX body in
      wrapper, scratch, automorphism, and schedule work. Fusing those steps can
      reduce memory traffic and dispatch/copy overhead without changing the
      dense MAT arithmetic count.
    status: profile_supported_first_fusion_candidate_neutral
    evidence: docs/stage18_cmux_profile_and_fusion_log.md
    current_decision: >
      Fine-grained Stage 18 profile shows from_DFT is the largest non-MAT CMUX
      component. The explicit SAB_PVW_FUSED_FROM_DFT_ADD candidate passes
      staged and target correctness gates, but the r=4 three-process full SAB
      sweep is neutral versus Stage 16. It should remain an ablation and not
      be promoted by default.
    failure_criteria:
      - CMUX wrapper-minus-MAT time does not decrease
      - full SAB throughput does not improve over Stage 16
      - lane equivalence or target correctness fails
  - id: H5_sparse_schedule_active_buffer_fusion
    statement: >
      Carrying the active PVW accumulator buffer and parity across
      RGSW-monomial and sparse_mul boundaries should reduce forced copyback
      and schedule traffic in complete SAB.
    mechanism: >
      The target binary path uses r_prec=7, so each RGSW monomial leaves the
      ping-pong accumulator on the opposite buffer. Returning an explicit active
      state lets the next sparse step and sub_a consume that buffer directly,
      delaying normalization until an API or extract boundary.
    status: stage20_positive_pending_noise_resource
    evidence: docs/stage20_active_buffer_log.md
    current_decision: >
      Stage 20 implemented SAB_PVW_ACTIVE_BUFFER_FUSION=true and confirmed
      copyback_calls drop from the legacy 40 to 0 for target r=2/r=4 while
      preserving target full-output correctness. Three-process full SAB A/B
      under spqlios_avx512 gave mean speedups of 1.270x for r=2 and 1.346x
      for r=4. Keep the path explicit pending noise/resource and broader
      parameter gates.
    failure_criteria:
      - schedule counters do not match the binary SET_2_3_2048 model
      - active-buffer lane phase differs from scalar reference
      - full SAB throughput does not improve over the Stage 16/18 baseline
      - resource overhead offsets the copyback reduction
  - id: H6_sub_a_rotation_scratch
    statement: >
      Scratch-aware or batched polynomial rotation for sub_a can reduce the
      remaining sparse-step overhead after active-buffer fusion.
    mechanism: >
      sub_a applies input-dependent monomial rotations to PVW lane state.
      Reusing scratch and separating index arithmetic, sign handling, and body
      loops may reduce memory traffic without changing the encrypted rotation
      semantics.
    status: stage21_neutral_not_promoted
    evidence: docs/stage21_suba_output_log.md
    current_decision: >
      Stage 21 implemented SAB_PVW_SUBA_OUTPUT_FUSION=true behind an explicit
      flag and validated target correctness plus exact schedule counts for
      r=2/r=4. It changed the expected target copyback count from Stage 20's 0
      to 1 while routing all 39 sub_a calls through direct inactive-buffer
      output. Sequential full SAB smokes were slower than the Stage 20 repeated
      baseline: r=2 reached 1.136x versus Stage 20 mean 1.270x, and r=4 reached
      1.308x versus Stage 20 mean 1.346x. Keep the code as a neutral ablation
      and do not promote it by default.
    failure_criteria:
      - rotation aliasing cannot be made explicit and safe
      - per-step phase equivalence fails
      - sub_a time is not material in the post-Stage-20 profile
      - full SAB benchmark is neutral or negative
  - id: H7_mat_avx512_layout_tiling_limit
    statement: >
      The current MAT-aware AVX512 external product may still be improved by
      r-specific register tiling or selector/output layout changes, but any
      kernel-level win must translate to complete SAB before it can support a
      bootstrapping claim.
    mechanism: >
      MAT-aware accumulation reduces repeated decomposed-row loads and output
      stores compared with a generic single-poly AVX loop. At r=4, dense
      (1+r)^2 arithmetic and register pressure may cap this benefit; tiling or
      layout changes might reduce spills and memory traffic.
    status: planned_stage22
    evidence: theory_checks/mat_avx_memory_model.md
    current_decision: >
      Stage 15/16 support scoped positive AVX512 MAT evidence, but not a
      theoretical-optimality claim. Stage 22 must compare generic and MAT-aware
      AVX paths with assembly or perf-counter attribution before any stronger
      claim is made.
    failure_criteria:
      - microbench does not show expected memory-operation reduction
      - assembly or counters show avoidable spills/traffic remain unexplained
      - full SAB A/B does not improve even if the kernel improves
      - layout changes require incompatible key formats without enough gain
  - id: H8_parameter_branch_generalization
    statement: >
      A PVW/MAT-SAB acceleration claim can be generalized beyond BINARY
      SET_2_3_2048 only if correctness, performance, and resource evidence
      hold across additional parameters and supported SAB branches.
    mechanism: >
      The relative cost of MAT external products, sparse schedule work, sub_a,
      extract, and key switching depends on N, h, r_prec, branch type, and
      backend. A single target parameter can hide branch-specific regressions.
    status: planned_stage26
    evidence: docs/roadmap_stage19_plus.md
    current_decision: >
      Keep the current engineering claim scoped to the tested binary target
      until Stage 26 expands coverage. Unsupported ternary/include-zero paths
      must be labeled out of scope rather than implied.
    failure_criteria:
      - added parameter sets fail correctness or noise gates
      - speedup appears only on one narrow configuration
      - branch-specific code paths are not tested but are claimed
  - id: H9_paper_claim_novelty
    statement: >
      The project can support a paper-level contribution only if the final
      promoted PVW/MAT-SAB path has complete-SAB evidence and a literature audit
      shows that the SAB-specific integration or fusion is not already known.
    mechanism: >
      PVW/MAT external products and shared-mask batching have prior-art risk.
      A defensible contribution must isolate what is new in the SAB adaptation,
      schedule fusion, complexity reduction, or implementation evidence.
    status: planned_stage27
    evidence: docs/goal_sab_max_acceleration.md
    current_decision: >
      Current evidence supports an engineering optimization, not yet a novelty
      claim. Stage 27 must build the related-work matrix and citation support
      bank before manuscript claims are promoted.
    failure_criteria:
      - related work already covers the claimed algorithmic idea
      - full SAB benchmark evidence is missing or only smoke-level
      - theory/noise/security discussion does not support changed boundaries
      - claim scope exceeds tested parameters or branches
